# fly.toml app configuration file generated for turnova
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'turnova'
primary_region = 'ewr'

[build]
[env]
  DATA_DIR = '/data'
  PORT = '3000'

[[mounts]]
  source = 'turnova_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
